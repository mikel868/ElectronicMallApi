# =========================================================
#  生产环境（Docker Compose / 云服务器）
#  通过 SPRING_PROFILES_ACTIVE=prod 激活
#  所有中间件均通过环境变量注入，无默认值（强制必须配置）
# =========================================================
app:
  es:
    # 生产默认关闭 Elasticsearch（临时不上线）；恢复时设 APP_ES_ENABLED=true 并启用 docker-compose 中的 es 服务
    enabled: ${APP_ES_ENABLED:false}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?serverTimezone=GMT%2b8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    # 生产推荐加连接池监控
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: false
  data:
    redis:
      database: ${REDIS_DB:0}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          min-idle: 2
          max-active: 16
          max-idle: 8
          max-wait: -1ms
      timeout: 5000ms
  elasticsearch:
    cluster-nodes: ${ES_HOST}:${ES_PORT:9200}
    cluster-name: ${ES_CLUSTER_NAME:elasticsearch}

