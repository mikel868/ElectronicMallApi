# =========================================================
#  公共配置（所有环境共享）
# =========================================================
server:
  port: ${SERVER_PORT:9191}

spring:
  application:
    name: electronic-mall-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

# MyBatis 全局
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 业务可调参数
app:
  jwt:
    # 用环境变量覆盖；默认值仅用于本地开发
    secret: ${JWT_SECRET:electronic-mall-default-secret-change-me}
    expire-minutes: ${JWT_EXPIRE_MINUTES:1440}
  cors:
    # 生产环境必须改为白名单，例如：https://mall.example.com,http://123.45.67.89
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  storage:
    backend: ${STORAGE_BACKEND:local}
  es:
    # Elasticsearch 总开关：false 时所有 ES Bean 不创建，搜索回退到 MySQL LIKE 查询
    enabled: ${APP_ES_ENABLED:true}

# 文件存储抽象层（与 com.rabbiter.em.storage 对应）
storage:
  backend: ${STORAGE_BACKEND:local}
  local:
    # 本地适配器根目录，dev 默认项目根，prod 应改为 /opt/mall/data
    base-path: ${STORAGE_LOCAL_BASE_PATH:./}

# 日志
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    dev.langchain4j: ${LANGCHAIN4J_LOG_LEVEL:INFO}
    com.rabbiter.em: ${APP_LOG_LEVEL:DEBUG}
