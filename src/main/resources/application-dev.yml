# =========================================================
#  开发环境（连本地 MySQL + 虚拟机 Redis/ES）
#  通过 SPRING_PROFILES_ACTIVE=dev 激活（或不设默认即是 dev）
# =========================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:electronic_mall}?serverTimezone=GMT%2b8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      database: ${REDIS_DB:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          min-idle: 0
          max-active: 8
          max-idle: 8
          max-wait: -1ms
      timeout: 30000ms
  elasticsearch:
    cluster-nodes: ${ES_HOST:192.168.13.132}:${ES_PORT:9200}
    cluster-name: elasticsearch

