# =========================================================
#  本地开发用：只起 MySQL + Redis 两个容器
#  app (Spring Boot) 在 IDEA 里跑，通过 localhost 连接
#
#  使用：
#    cd deploy
#    docker compose -f docker-compose.dev.yml up -d
#    docker compose -f docker-compose.dev.yml ps
#    docker compose -f docker-compose.dev.yml logs -f
#    docker compose -f docker-compose.dev.yml down   # 停止
# =========================================================
name: em-dev

services:
  mysql:
    image: mysql:8.0
    container_name: em-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: electronic_mall
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"     # 宿主机 3307 -> 容器 3306 (避开 Windows 本地 MySQL)
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: em-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"     # 暴露到宿主机 localhost:6379
    volumes:
      - ./data/redis:/data

networks:
  default:
    driver: bridge
