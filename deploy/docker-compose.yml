# =========================================================
#  ElectronicMall 一体化部署 (单机版)
#
#  目录约定（默认全部在 ./data 下，便于备份/迁移）：
#    ./data/mysql     - MySQL 数据
#    ./data/redis     - Redis 数据
#    ./data/es        - Elasticsearch 数据
#    ./data/uploads   - 上传的 avatar / file
#    ./sql/init/      - MySQL 启动时自动导入的 SQL
#
#  使用：
#    cp .env.example .env  && 编辑 .env
#    docker compose up -d
# =========================================================
name: electronic-mall

services:
  # ----------------- 后端应用 -----------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: electronic-mall-api:latest
    container_name: em-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      APP_ES_ENABLED: "false"   # 暂时关闭 ES，搜索回退到 MySQL
    ports:
      - "127.0.0.1:9191:9191"   # 只暴露给本机，由 Nginx 反代
    volumes:
      - ../data/uploads:/opt/mall/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # ---- 内存上限保护，避免 OOM 拖垮整台机器 ----
    mem_limit: 768m
    mem_reservation: 512m
    networks:
      - mall-net

  # ----------------- MySQL -----------------
  mysql:
    image: mysql:8.0
    container_name: em-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # ---- 2C2G 服务器内存优化 ----
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=50
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"   # 仅本机可见
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 384m
    networks:
      - mall-net

  # ----------------- Redis -----------------
  redis:
    image: redis:7-alpine
    container_name: em-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - mall-net

  # ----------------- Elasticsearch (暂时下线) -----------------
  # 暂时不上线 ES，搜索回退到 MySQL LIKE 查询。
  # 重新启用步骤：
  #   1. 在 .env 中设置 APP_ES_ENABLED=true
  #   2. 取消下面 es: 服务块的注释
  #   3. 在 app.depends_on 中恢复 es: condition: service_started
  #   4. 在 app.environment 中恢复 ES_HOST: es
  # es:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:7.12.1
  #   container_name: em-es
  #   restart: unless-stopped
  #   environment:
  #     - discovery.type=single-node
  #     - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
  #     - xpack.security.enabled=false
  #     - cluster.name=elasticsearch
  #   ports:
  #     - "127.0.0.1:9200:9200"
  #   volumes:
  #     - ./data/es:/usr/share/elasticsearch/data
  #   networks:
  #     - mall-net

  # ----------------- Nginx (前端 + 反代) -----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: em-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mall.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 没有前端 dist 时挂一个空目录，访问 / 会 404，但 /api、/swagger 仍可用
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../data/uploads:/opt/mall/data:ro
    depends_on:
      - app
    networks:
      - mall-net

networks:
  mall-net:
    driver: bridge
