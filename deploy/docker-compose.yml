# =========================================================
#  ElectronicMall 一体化部署 (单机版)
#
#  目录约定（默认全部在 ./data 下，便于备份/迁移）：
#    ./data/mysql     - MySQL 数据
#    ./data/redis     - Redis 数据
#    ./data/es        - Elasticsearch 数据
#    ./data/uploads   - 上传的 avatar / file
#    ./sql/init/      - MySQL 启动时自动导入的 SQL
#
#  使用：
#    cp .env.example .env  && 编辑 .env
#    docker compose up -d
# =========================================================
name: electronic-mall

services:
  # ----------------- 后端应用 -----------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: electronic-mall-api:latest
    container_name: em-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      ES_HOST: es
    ports:
      - "127.0.0.1:9191:9191"   # 只暴露给本机，由 Nginx 反代
    volumes:
      - ../data/uploads:/opt/mall/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      es:
        condition: service_started
    networks:
      - mall-net

  # ----------------- MySQL -----------------
  mysql:
    image: mysql:8.0
    container_name: em-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"   # 仅本机可见
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mall-net

  # ----------------- Redis -----------------
  redis:
    image: redis:7-alpine
    container_name: em-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - mall-net

  # ----------------- Elasticsearch -----------------
  # ES 比较吃内存，单机部署建议宿主机至少 8G RAM
  # 若内存吃紧，可在 .env 中调 ES_JAVA_OPTS
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.12.1
    container_name: em-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      - xpack.security.enabled=false
      - cluster.name=elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
    networks:
      - mall-net

  # ----------------- Nginx (前端 + 反代) -----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: em-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mall.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../data/uploads:/opt/mall/data:ro
    depends_on:
      - app
    networks:
      - mall-net

networks:
  mall-net:
    driver: bridge
