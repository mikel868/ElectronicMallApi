# =========================================================
#  Nginx 配置 (前端托管 + 后端反代 + 文件静态映射)
# =========================================================

# 后端上游
upstream mall_backend {
    server app:9191;
    keepalive 32;
}

# ---------- 限流区：保护秒杀接口 ----------
limit_req_zone $binary_remote_addr zone=seckill:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m       rate=30r/s;

# ---------- HTTP (无域名时直接 IP 访问) ----------
server {
    listen 80;
    server_name _;

    client_max_body_size 30m;   # 与后端 multipart 一致

    # ---------- 前端静态 ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # 前端路由回退
        gzip on;
        gzip_types text/plain application/javascript text/css application/json;
        expires 1h;
    }

    # ---------- 上传文件静态映射 ----------
    location /avatar/ {
        alias /opt/mall/data/avatar/;
        expires 7d;
        access_log off;
    }
    location /file/ {
        alias /opt/mall/data/file/;
        expires 7d;
        access_log off;
    }

    # ---------- 秒杀接口（强限流） ----------
    location ~ ^/api/seckill {
        limit_req zone=seckill burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # ---------- AI SSE 流式接口（关闭缓冲，长超时） ----------
    location /chat {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;

        proxy_buffering off;           # ★ SSE 必须关闭缓冲
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding off;
    }

    # ---------- 普通 API ----------
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://mall_backend/;
        include /etc/nginx/proxy_params;
    }
    location /swagger-ui/ {
        proxy_pass http://mall_backend/swagger-ui/;
    }
    location /v3/api-docs {
        proxy_pass http://mall_backend;
    }
}
