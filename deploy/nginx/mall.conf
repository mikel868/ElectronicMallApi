# =========================================================
#  Nginx 配置 (前端托管 + 后端反代 + 文件静态映射)
#
#  后端路径分布（来自 Spring Boot Controller）：
#    带 /api 前缀：/api/good /api/cart /api/order /api/category /api/icon
#                  /api/carousel /api/address /api/income /api/seckill
#                  （/api/ai 在 AI 客服恢复时启用）
#    不带前缀：    /login /register /user /userinfo /userid /role
#                 /sendSmsCode /captchaLogin /search /sync /file /avatar
#                 （/chat SSE 在 AI 客服恢复时启用）
# =========================================================

# 后端上游
upstream mall_backend {
    server app:9191;
    keepalive 32;
}

# ---------- 限流区：保护秒杀接口 ----------
limit_req_zone $binary_remote_addr zone=seckill:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m       rate=30r/s;

# ---------- HTTP (无域名时直接 IP 访问) ----------
server {
    listen 80;
    server_name _;

    client_max_body_size 30m;   # 与后端 multipart 一致

    # ============================================================
    #  1) 精确/单接口代理（必须放在 / 之前，否则被 SPA 兜底吃掉）
    # ============================================================

    # ----- 文件上传 POST 接口（注意：精确匹配优先于 /file/ 静态） -----
    location = /file/upload {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }
    location = /avatar/upload {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # ----- 用户相关（UserController 无 /api 前缀） -----
    location ~ ^/(login|register|userinfo|userid|role|sendSmsCode|captchaLogin) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }
    location ~ ^/user(/|$) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # ----- AI SSE 流式接口（AI 客服下线，恢复时取消整段注释） -----
    # location /chat {
    #     limit_req zone=api burst=10 nodelay;
    #     proxy_pass http://mall_backend;
    #     include /etc/nginx/proxy_params;
    #
    #     proxy_buffering off;           # SSE 必须关闭缓冲
    #     proxy_cache off;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_read_timeout 600s;
    #     proxy_send_timeout 600s;
    #     chunked_transfer_encoding off;
    # }

    # ----- 商品搜索（ES 已关闭，回退 MySQL） -----
    location /search/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # ----- 数据同步（ES 关闭时返回「未启用」） -----
    location /sync/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # ============================================================
    #  2) 上传后的静态文件访问（GET /avatar/xxx /file/xxx）
    # ============================================================
    location /avatar/ {
        alias /opt/mall/data/avatar/;
        expires 7d;
        access_log off;
    }
    location /file/ {
        alias /opt/mall/data/file/;
        expires 7d;
        access_log off;
    }

    # ============================================================
    #  3) /api/ 前缀的后端接口
    # ============================================================

    # 秒杀接口（强限流）
    location ~ ^/api/seckill {
        limit_req zone=seckill burst=20 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # 普通 API（保持路径，不剥前缀）
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://mall_backend;
        include /etc/nginx/proxy_params;
    }

    # ============================================================
    #  4) 前端静态（兜底，必须放最后）
    # ============================================================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # 前端路由回退
        gzip on;
        gzip_types text/plain application/javascript text/css application/json;
        expires 1h;
    }

    # Swagger（可选，调试时打开）
    location /swagger-ui/ {
        proxy_pass http://mall_backend/swagger-ui/;
    }
    location /v3/api-docs {
        proxy_pass http://mall_backend;
    }
}
